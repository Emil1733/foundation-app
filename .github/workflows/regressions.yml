name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.cjs
      - run: node scripts/test-legacy-redirects.cjs
      - run: node scripts/test-soil-widget.cjs
      - run: node scripts/test-lookup-routes.cjs
      - run: npm run lint
